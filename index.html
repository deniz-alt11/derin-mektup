<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derin İçin</title>
    <style>
        /* TEMEL AYARLAR (Her şeyi ortalar ve tek zarf yapar) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #1a0a0a; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; overflow: hidden; position: relative; }

        /* TEK VE DÜZGÜN ZARF TASARIMI */
        .envelope-wrapper { position: relative; width: 300px; height: 200px; background-color: #ff4d6d; border-radius: 10px; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s; z-index: 2; margin-bottom: 20px; }
        .envelope-wrapper::after { content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 100px solid #ff1a4a; transition: border 0.6s; }
        .envelope-wrapper.open { transform: rotateX(180deg); }
        .envelope-wrapper.open::after { border-top-width: 0; border-bottom: 100px solid #ff1a4a; top: 100px; }

        /* MEKTUP VE İÇERİK */
        .letter-wrapper { position: absolute; bottom: 0; left: 10px; width: 280px; height: 180px; background-color: #fff; border-radius: 8px; padding: 20px; text-align: center; transform: translateZ(-1px); transition: transform 0.6s, bottom 0.6s; z-index: 1; opacity: 0; }
        .envelope-wrapper.open .letter-wrapper { bottom: 100px; transform: translateZ(1px); opacity: 1; }
        .letter-text { color: #333; font-size: 16px; line-height: 1.6; }

        /* BUTONLAR VE KONUMU */
        .buttons-container { display: flex; gap: 15px; margin-top: 20px; z-index: 3; }
        .buttons-container button { padding: 10px 25px; background-color: #ff1a4a; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .buttons-container button:hover { background-color: #e60039; }

        /* UÇAN KALPLER (Miktarı azaltıldı) */
        .heart { position: absolute; color: #ff1a4a; animation: fly 4s infinite linear; opacity: 0.8; z-index: 0; }
        @keyframes fly { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelope">
        <div class="letter-wrapper">
            <p class="letter-text">Seni her şeyden çok seviyorum, Derin.</p>
        </div>
    </div>

    <div class="buttons-container">
        <button id="openBtn">AÇ</button>
        <button id="resetBtn">KAPAT</button>
    </div>

    <script>
        // Sadece mektubu açan basit kodlar
        const envelope = document.getElementById('envelope');
        const openBtn = document.getElementById('openBtn');
        const resetBtn = document.getElementById('resetBtn');

        openBtn.addEventListener('click', () => {
            envelope.classList.add('open');
        });

        resetBtn.addEventListener('click', () => {
            envelope.classList.remove('open');
        });

        // Kalp yağmuru (Miktarı 15'e indirdim)
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.fontSize = Math.random() * 10 + 15 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300); // 300ms'de bir kalp
    </script>
</body>
</html>
